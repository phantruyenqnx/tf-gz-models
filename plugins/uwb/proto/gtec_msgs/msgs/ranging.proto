// gz_harmonic/proto/gtec_msgs/msgs/ranging.proto
syntax = "proto3";
package gtec_msgs.msgs;

import "gz/msgs/header.proto";

/// UWB ranging measurement (mirrors the fork's gtec_msgs/Ranging fields).
message Ranging
{
  gz.msgs.Header header        = 1;
  int32          anchor_id     = 2;
  int32          tag_id        = 3;
  double         range         = 4;  // millimetres, as in the legacy plugin
  uint32         seq           = 5;
  double         rss           = 6;
  double         error_estimation = 7;
  double         angle         = 8;  // radians; NaN when return_angle is false
}
